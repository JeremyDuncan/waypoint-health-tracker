default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 3) %>
  timeout: 10000
development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_PATH", "storage/development.sqlite3") %>
test:
  <<: *default
  database: storage/test.sqlite3
production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_PATH", "/data/hearth.sqlite3") %>
