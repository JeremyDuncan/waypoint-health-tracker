# Keep this project name stable to preserve existing data volumes.
name: health-tracker
services:
  app:
    build: .
    image: waypoint-health:local
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in the selected environment file; see README}
      APP_HOST: ${APP_HOST:-localhost}
      FORCE_SSL: ${FORCE_SSL:-true}
      DATABASE_PATH: /data/hearth.sqlite3
      RAILS_MAX_THREADS: 3
    volumes:
      - data:/data
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  data:
