# Keep this project name stable to preserve existing data volumes.
name: health-tracker-dev
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: waypoint-health:development
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      RAILS_ENV: development
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Run ./script/dev/run to create development .env}
      FORCE_SSL: "false"
      DATABASE_PATH: /data/development.sqlite3
      RAILS_MAX_THREADS: 3
    volumes:
      - .:/app
      - data:/data
      - storage:/app/storage
      - tmp:/app/tmp
      - logs:/app/log
    stop_grace_period: 30s
volumes:
  data:
  storage:
  tmp:
  logs:
